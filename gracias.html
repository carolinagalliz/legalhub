<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Pago confirmado | LegalHub</title>

  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&display=swap" rel="stylesheet">

  <style>
    body {
      margin: 0;
      background: #020b14;
      color: #e6faff;
      font-family: 'Orbitron', sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
    }

    .container {
      text-align: center;
      padding: 40px;
      border-radius: 20px;
      border: 1px solid rgba(0,240,255,0.3);
      background: rgba(2,11,20,0.95);
      box-shadow: 0 0 40px rgba(0,240,255,0.2);
      max-width: 500px;
    }

    h1 {
      font-size: 24px;
      color: #00f0ff;
      margin-bottom: 20px;
      text-shadow: 0 0 10px #00f0ff;
    }

    p {
      font-size: 14px;
      color: #bfefff;
      margin-bottom: 30px;
      line-height: 1.6;
    }

    .btn {
      display: inline-block;
      padding: 12px 25px;
      border-radius: 10px;
      border: 1px solid #00f0ff;
      color: #00f0ff;
      text-decoration: none;
      transition: 0.3s;
      box-shadow: 0 0 10px rgba(0,240,255,0.4);
    }

    .btn:hover {
      background: #00f0ff;
      color: #020b14;
      box-shadow: 0 0 25px rgba(0,240,255,0.8);
    }

    .status {
      font-size: 12px;
      margin-top: 20px;
      color: #7ffcff;
      opacity: 0.7;
    }
  </style>
</head>

<body>

  <div class="container">
    <h1>✔ Pago confirmado</h1>

    <p>
      Tu suscripción a <strong>LegalHub</strong> fue procesada correctamente.<br><br>

    </p>

  Ingresar al sistema
</a>

    <div class="status">
      Sistema activo • Validación en curso
    </div>
  </div>

</body>
</html>
